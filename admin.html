<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>chamduldeey — Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0712;
      color: white;
      padding: 30px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    h1 {
      margin-bottom: 10px;
    }

    .login,
    .dashboard {
      background: rgba(255,255,255,0.06);
      padding: 24px;
      border-radius: 20px;
      margin-top: 20px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      box-sizing: border-box;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.15);
      background: #171022;
      color: white;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: bold;
      margin-right: 8px;
    }

    .login-btn {
      width: 100%;
      margin-top: 10px;
    }

    .letter {
      background: rgba(255,255,255,0.07);
      padding: 20px;
      border-radius: 16px;
      margin-top: 18px;
    }

    .meta {
      color: #bdb5c9;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .text {
      white-space: pre-wrap;
      line-height: 1.6;
      margin: 15px 0;
    }

    .approve {
      background: #8b5cf6;
      color: white;
    }

    .delete {
      background: #c62828;
      color: white;
    }

    .logout {
      float: right;
      background: #333;
      color: white;
    }

    .hidden {
      display: none;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      background: #372844;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <div class="container">

    <h1>👑 chamduldeey Admin</h1>
    <p>Ирсэн захидлуудыг эндээс шалгана.</p>

    <div id="loginBox" class="login">
      <h2>Admin нэвтрэх</h2>

      <input id="email" type="email" placeholder="Email">
      <input id="password" type="password" placeholder="Password">

      <button class="login-btn" onclick="login()">Нэвтрэх</button>

      <p id="loginMessage"></p>
    </div>

    <div id="dashboard" class="dashboard hidden">
      <button class="logout" onclick="logout()">Гарах</button>

      <h2>Захидлууд</h2>

      <div id="letters"></div>
    </div>

  </div>

  <script>
    const SUPABASE_URL =
      'https://sxaribgfgislxzbrdluv.supabase.co';

    const SUPABASE_KEY =
      sb_publishable_rF04Bi4wxkZUl-yhmhSRrQ_2aoFJwIS

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    async function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const { error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        document.getElementById("loginMessage").textContent =
          "Алдаа: " + error.message;
        return;
      }

      await checkAdmin();
    }

    async function checkAdmin() {
      const {
        data: { user }
      } = await supabaseClient.auth.getUser();

      if (!user) {
        showLogin();
        return;
      }

      const { data: admin, error } = await supabaseClient
        .from("admins")
        .select("user_id")
        .eq("user_id", user.id)
        .maybeSingle();

      if (error || !admin) {
        document.getElementById("loginMessage").textContent =
          "Энэ account admin биш байна.";
        await supabaseClient.auth.signOut();
        return;
      }

      document.getElementById("loginBox").classList.add("hidden");
      document.getElementById("dashboard").classList.remove("hidden");

      loadLetters();
    }

    async function loadLetters() {
      const { data, error } = await supabaseClient
        .from("letters")
        .select("*")
        .order("created_at", { ascending: false });

      const box = document.getElementById("letters");
      box.innerHTML = "";

      if (error) {
        box.innerHTML = "<p>Алдаа: " + error.message + "</p>";
        return;
      }

      if (!data || data.length === 0) {
        box.innerHTML = "<p>Одоогоор захидал алга.</p>";
        return;
      }

      data.forEach(letter => {
        const item = document.createElement("div");
        item.className = "letter";

        item.innerHTML = `
          <div class="meta">
            ID: ${letter.id}
            · Хэнд: ${letter.recipient || ""}
            · ${letter.created_at || ""}
          </div>

          <div>
            <span class="status">
              ${letter.status || "pending"}
            </span>
          </div>

          <div class="text"></div>

          <div class="meta">
            Нэр: ${letter.author || "Нууц хүн"}
            <br>
            Hashtag: ${letter.hashtag || ""}
          </div>

          <button class="approve">
            Approve
          </button>

          <button class="delete">
            Delete
          </button>
        `;

        item.querySelector(".text").textContent = letter.letter || "";

        item.querySelector(".approve").onclick = () =>
          approveLetter(letter.id);

        item.querySelector(".delete").onclick = () =>
          deleteLetter(letter.id);

        box.appendChild(item);
      });
    }

    async function approveLetter(id) {
      const { error } = await supabaseClient
        .from("letters")
        .update({
          status: "approved",
          approved: true
        })
        .eq("id", id);

      if (error) {
        alert("Алдаа: " + error.message);
        return;
      }

      loadLetters();
    }

    async function deleteLetter(id) {
      if (!confirm("Энэ захидлыг устгах уу?")) return;

      const { error } = await supabaseClient
        .from("letters")
        .delete()
        .eq("id", id);

      if (error) {
        alert("Алдаа: " + error.message);
        return;
      }

      loadLetters();
    }

    async function logout() {
      await supabaseClient.auth.signOut();
      showLogin();
    }

    function showLogin() {
      document.getElementById("dashboard").classList.add("hidden");
      document.getElementById("loginBox").classList.remove("hidden");
    }

    checkAdmin();
  </script>
</body>
</html>
